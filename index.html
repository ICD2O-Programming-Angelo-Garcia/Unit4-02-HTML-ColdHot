<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Temperature Checker" />
    <meta name="keywords" content="temperature, check, hot, cold" />
    <meta name="author" content="Angelo Garcia" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Checker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-purple.min.css" />
  </head>
  <body>
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

    
    <!-- Link to the script file -->
    <script src="js/script.js"></script>

    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
      <header class="mdl-layout__header">
        <div class="mdl-layout__header-row">
          <span class="mdl-layout-title">Temperature Checker</span>
        </div>
      </header>

      <main class="mdl-layout__content">
        <table>
          <tr>
            <th>
              <img
                src="https://i0.wp.com/geographicbook.com/wp-content/uploads/2023/11/temperature.png?fit=512%2C351&ssl=1" width="75%" height="auto"
              />
            </th>
          </tr>
        </table>

        <!-- Temperature input -->
        <form action="#">
          <p>Enter the temperature in Celsius</p>
          <div class="mdl-textfield mdl-js-textfield">
            <input
              class="mdl-textfield__input"
              type="number"
              id="temperature-input"
              min="-50"
              max="50"
            />
            <label class="mdl-textfield__label" for="temperature-input">Enter temperature</label>
            <span class="mdl-textfield__error">Please enter a valid number</span>
          </div>
        </form>

        <!-- Check button -->
        <button
          class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent"
          onclick="checkTemperature()"
        >
          Click to Check
        </button>

        <br />

        <!-- Result display -->
        <div id="result">
          <!-- Result will be displayed here -->
        </div>
      </main>
    </div>
  </body>
</html>
